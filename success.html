<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Message Sent</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:#07071a;
    color:white;
    font-family:'Outfit',sans-serif;
}

.success-box{
    width:90%;
    max-width:500px;
    text-align:center;

    padding:40px;

    border-radius:20px;

    background:rgba(255,255,255,.03);
    border:1px solid rgba(0,234,255,.2);

    backdrop-filter:blur(10px);
}

.success-icon{
    font-size:70px;
    margin-bottom:20px;
}

h1{
    margin-bottom:15px;
}

p{
    color:#b8b8d8;
    line-height:1.7;
}

.back-btn{
    display:inline-block;
    margin-top:25px;

    padding:12px 28px;

    border-radius:50px;

    text-decoration:none;
    color:white;

    background:linear-gradient(
        135deg,
        #00eaff,
        #6119a9
    );
}

</style>
</head>

<body>

<div class="success-box">

    <div class="success-icon">✅</div>

    <h1>Message Sent Successfully</h1>

    <p>
        Thank you for contacting me.
        I will review your message and respond soon.
    </p>

    <a
      href="https://madhiyarasu-portfolio.vercel.app"
      class="back-btn">
      Return to Portfolio
    </a>

</div>

</body>
</html>
