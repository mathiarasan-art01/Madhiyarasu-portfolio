<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07090f">
  <meta http-equiv="refresh" content="5;url=/">
  <title>Message received — Madhiyarasu D D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07090f;--surface:#0d111b;--text:#f1f4f8;--muted:#8992a6;--line:rgba(196,211,237,.16);--accent:#63e6d2}
    *{box-sizing:border-box}html{background:var(--bg)}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:1.5rem;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Manrope",sans-serif}.grid{position:fixed;inset:0;opacity:.28;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle,#000,transparent 72%)}.card{position:relative;width:min(100%,620px);padding:clamp(2rem,7vw,5rem);text-align:center;background:rgba(13,17,27,.86);border:1px solid var(--line);border-radius:1.25rem;box-shadow:0 30px 100px rgba(0,0,0,.45)}.signal{width:64px;height:64px;margin:0 auto 2rem;display:grid;place-items:center;border:1px solid var(--accent);border-radius:50%;color:var(--accent);font-size:1.4rem}.signal::before{content:"✓"}p.label{margin:0 0 1rem;color:var(--accent);font-size:.67rem;letter-spacing:.17em;text-transform:uppercase}h1{margin:0;font-family:"Outfit",sans-serif;font-size:clamp(2.5rem,8vw,4.5rem);line-height:1;letter-spacing:-.04em}p.copy{margin:1.5rem auto 2rem;max-width:400px;color:var(--muted);line-height:1.7}a{display:inline-flex;padding:.8rem 1.2rem;border-radius:999px;background:var(--accent);color:var(--bg);text-decoration:none;font-size:.82rem;font-weight:600}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <main class="card" role="status" aria-live="polite">
    <div class="signal" aria-hidden="true"></div>
    <p class="label">Transmission complete</p>
    <h1>Message received.</h1>
    <p class="copy">Thank you for reaching out. I&apos;ll get back to you as soon as I can. You&apos;ll return to the portfolio shortly.</p>
    <a href="/">Return to portfolio</a>
  </main>
</body>
</html>
